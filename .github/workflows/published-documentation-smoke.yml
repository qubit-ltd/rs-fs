name: Published Documentation Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  quick-start:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out this revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - name: Install the minimum supported Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Run the published Quick Start
        run: python3 scripts/check-published-quick-start.py --artifacts-dir "$RUNNER_TEMP/published-smoke"
        env:
          RUSTUP_TOOLCHAIN: 1.94.0
      - name: Upload dependency resolution diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: published-smoke-resolution
          path: ${{ runner.temp }}/published-smoke
          if-no-files-found: warn
