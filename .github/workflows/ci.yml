name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

jobs:
  rust-ci:
    uses: qubit-ltd/rs-ci/.github/workflows/rust-ci.yml@14ec4b152a19f8be585730f6ee945bc5ff822ad8
    with:
      coverage_enforce_thresholds: "1"

  style:
    name: Rust style policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Run shared style checks
        run: .rs-ci/style-check.sh
