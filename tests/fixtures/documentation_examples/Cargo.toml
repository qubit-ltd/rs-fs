[package]
name = "qubit-fs-documentation-examples"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]

[features]
default = ["async"]
async = []

[dependencies]
qubit-fs = { path = "../../..", version = "0.2", features = ["async"] }

qubit-fs-local = { path = "../../../../rs-fs-local", version = "0.10" }

qubit-io = { path = "../../../../rs-io", version = "0.19" }

tempfile = "3"
