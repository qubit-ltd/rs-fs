[package]
name = "qubit-fs-documentation-examples"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]

[features]
default = ["async"]
async = []

[dependencies]
qubit-fs = { version = "^0.3", features = ["async"] }

qubit-fs-local = { version = "^0.11" }

qubit-io = "^0.19"

tempfile = "3"

[patch.crates-io]
qubit-local-files = { path = "../../../../rs-local-files" }
