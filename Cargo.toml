[package]
name = "qubit-fs"
version = "0.2.2"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-fs"
description = "Provider-neutral synchronous and asynchronous filesystem abstraction for Rust"
homepage = "https://github.com/qubit-ltd/rs-fs"
documentation = "https://docs.rs/qubit-fs"
readme = "README.md"
keywords = ["filesystem", "storage", "spi", "path", "qubit"]
categories = ["filesystem", "rust-patterns"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/benches/**",
    "/doc/**",
    "/src/**",
    "/tests/**",
]

[workspace]
resolver = "3"

[lib]
name = "qubit_fs"
doctest = true

[features]
default = []
async = []

[dependencies]
qubit-budget = { path = "../rs-budget", version = "0.9" }

fluent-uri = "^0.4"
qubit-io = { path = "../rs-io", version = "0.19" }

qubit-redact = { path = "../rs-redact", version = "0.9", features = ["uri"] }


[dev-dependencies]
criterion = "^0.8"

[[bench]]
name = "read_prefix"
harness = false

[[bench]]
name = "stream_copy_fallback"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[package.metadata.docs.rs]
all-features = true
