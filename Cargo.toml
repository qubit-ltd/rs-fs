[package]
name = "qubit-fs"
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-fs"
description = "Provider-neutral synchronous and asynchronous filesystem abstraction for Rust"
homepage = "https://github.com/qubit-ltd/rs-fs"
documentation = "https://docs.rs/qubit-fs"
readme = "README.md"
keywords = ["filesystem", "storage", "spi", "path", "qubit"]
categories = ["filesystem", "rust-patterns"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/benches/**",
    "/doc/file_system_design.zh_CN.md",
    "/doc/**/user_guide*.md",
    "/src/**",
    "/tests/**",
]

[lib]
name = "qubit_fs"
doctest = true

[features]
default = []
async = []

[dependencies]
qubit-budget = "0.5"
fluent-uri = "0.4.1"
qubit-io = "0.16"
qubit-redact = { version = "0.5", path = "../rs-redact", features = ["uri"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "stream_copy_fallback"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
